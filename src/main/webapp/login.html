<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            /* Matches the dark blue university theme from your image */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('Gemini_Generated_Image_e5jefie5jefie5je.png'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(248, 249, 250, 0.98);
            border-radius: 15px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .card-title {
            color: #0d235b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* --- Circle Selection Styles --- */
        .role-selection {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        input[type="radio"] { display: none; }

        .circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .admin-c { background-color: #2c3e50; }
        .alumni-c { background-color: #4a6fa5; }
        .student-c { background-color: #6395c9; }

        .circle:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.3); }

        /* --- The "Switch" Logic --- */
        .login-form-container { display: none; }

        /* When any radio is checked: hide selection, show form */
        #admin-opt:checked ~ .role-selection,
        #alumni-opt:checked ~ .role-selection,
        #student-opt:checked ~ .role-selection { display: none; }

        #admin-opt:checked ~ .login-form-container,
        #alumni-opt:checked ~ .login-form-container,
        #student-opt:checked ~ .login-form-container { display: block; animation: fadeIn 0.4s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Form Elements --- */
        .form-control { border-radius: 6px; padding: 12px; margin-bottom: 15px; }
        
        .btn-login-submit {
            background-color: #1c3161;
            color: white;
            padding: 10px 35px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
        }

        .register-text { margin-top: 25px; font-size: 0.85rem; color: #555; }
        .register-text a { color: #0d235b; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
    <h3 class="card-title">LOGIN</h3>

    <form action="LoginHandler" method="post">
        <input type="radio" name="role" id="admin-opt" value="admin" required>
        <input type="radio" name="role" id="alumni-opt" value="alumni" required>
        <input type="radio" name="role" id="student-opt" value="student" required>

        <div class="role-selection">
            <label for="admin-opt">
                <div class="circle admin-c">ADMIN</div>
            </label>
            <label for="alumni-opt">
                <div class="circle alumni-c">ALUMNI</div>
            </label>
            <label for="student-opt">
                <div class="circle student-c">STUDENT</div>
            </label>
        </div>

        <div class="login-form-container">
            <input type="text" name="uname" class="form-control" placeholder="Username" required>
            <input type="password" name="upass" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn-login-submit">LOGIN</button>
            <div class="mt-2">
                <a href="login.html" style="font-size: 0.75rem; color: #999;">← Change Role</a>
            </div>
        </div>
    </form>

    <div class="register-text">
        Don't have an account? <a href="register.html">Register here</a>
    </div>
</div>
</body>
</html>
