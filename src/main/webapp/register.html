<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('Gemini_Generated_Image_e5jefie5jefie5je.png');
            background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;
        }
        .register-card {
            background: rgba(248, 249, 250, 0.98); border-radius: 15px; padding: 30px;
            width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); text-align: center;
        }
        .role-selection { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        input[type="radio"] { display: none; }
        .circle {
            width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .alumni-c { background-color: #4a6fa5; } .student-c { background-color: #6395c9; }
        .register-form-container { display: none; text-align: left; }
        
        /* Show form and specific fields based on selection */
        #alumni-opt:checked ~ .role-selection, #student-opt:checked ~ .role-selection { display: none; }
        #alumni-opt:checked ~ .register-form-container, #student-opt:checked ~ .register-form-container { display: block; }
        
        /* Hide role-specific fields by default */
        .alumni-only, .student-only { display: none; }
        #alumni-opt:checked ~ .register-form-container .alumni-only { display: block; }
        #student-opt:checked ~ .register-form-container .student-only { display: block; }

        .form-control { margin-bottom: 10px; border-radius: 6px; }
        .btn-reg { background-color: #1c3161; color: white; width: 100%; font-weight: 600; padding: 10px; border: none; }
    </style>
</head>
<body>

<div class="register-card">
    <h3 style="color: #0d235b; font-weight: 700; margin-bottom: 25px;">REGISTRATION</h3>

    <form action="RegisterHandler" method="post">
        <input type="radio" name="role" id="alumni-opt" value="alumni" required>
        <input type="radio" name="role" id="student-opt" value="student" required>

        <div class="role-selection">
            <label for="alumni-opt"><div class="circle alumni-c">ALUMNI</div></label>
            <label for="student-opt"><div class="circle student-c">STUDENT</div></label>
        </div>

        <div class="register-form-container">
            <div class="row">
                <div class="col-md-6"><input type="text" name="fname" class="form-control" placeholder="First Name" required></div>
                <div class="col-md-6"><input type="text" name="lname" class="form-control" placeholder="Last Name" required></div>
            </div>
            <input type="email" name="uemail" class="form-control" placeholder="Email (e.g. rahul@email.com)" required>
            
            <div class="alumni-only">
                <input type="text" name="grad_year" class="form-control" placeholder="Graduation Year (e.g. 2019)">
                <input type="text" name="dept" class="form-control" placeholder="Department (e.g. Engineering)">
            </div>

            <div class="student-only">
                <input type="text" name="enroll_year" class="form-control" placeholder="Enrollment Year (e.g. 2023)">
            </div>

            <input type="text" name="uname" class="form-control" placeholder="Choose Username" required>
            <input type="password" name="upass" class="form-control" placeholder="Set Password" required>
            
            <button type="submit" class="btn-reg mt-2">CREATE ACCOUNT</button>
            <div class="text-center mt-2"><a href="register.html" style="font-size: 0.8rem; color: #999;">← Change Role</a></div>
        </div>
    </form>
    <div class="mt-3" style="font-size: 0.85rem;">Already have an account? <a href="login.html" style="color: #0d235b; font-weight: bold; text-decoration: none;">Login</a></div>
</div>

</body>
</html>
